// очищаем текст
function normalizeText(text) {
  return text
    .toLowerCase()
    .replace(/[.,!?;:()"'-]/g, "") // убираем знаки
    .replace(/\s+/g, " ") // убираем лишние пробелы
    .trim();
}

function performSearch() {
  const input = document.getElementById("searchInput").value;
  const query = normalizeText(input);

  const results = document.getElementById("results");
  results.innerHTML = "";

  if (!query) {
    results.innerHTML = "<p>Please enter a search term.</p>";
    return;
  }

  const found = searchData.filter(item => {
    const itemText = normalizeText(item.text);
    return itemText.includes(query) || query.includes(itemText);
  });

  if (found.length === 0) {
    results.innerHTML = "<p>No results found.</p>";
    return;
  }

  found.forEach(item => {
    results.innerHTML += `
      <div class="result-item">
        <h4>${item.text}</h4>
        <p>Found in ICD section</p>
        <a href="${item.page}#${item.target}">
          Open section
        </a>
      </div>
    `;
  });
}
